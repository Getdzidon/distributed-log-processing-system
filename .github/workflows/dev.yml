# Dev environment deployment workflow
# Triggers on push to dev branch and automatically deploys to dev EKS cluster
name: Deploy to Dev

on:
  push:
    branches: [dev]
    paths:
      - 'src/**'
      - 'infrastructure/helm/**'
      - 'Dockerfile'
      - 'requirements.txt'

permissions:
  id-token: write       # Required for OIDC authentication
  contents: read
  security-events: write  # Required for reusable workflow security scan

jobs:
  # Call reusable workflow for test, scan, and build
  build:
    uses: ./.github/workflows/reusable-build.yml
    with:
      environment: dev
    secrets: inherit  # Pass all secrets to reusable workflow
    
  # Deploy to dev EKS cluster
  deploy:
    needs: build  # Only deploy if build succeeds
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: https://dev.log-processor.cmg.io
    steps:
      - uses: actions/checkout@v6
      
      # Authenticate with AWS using OIDC
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-central-1
          
      # Deploy to dev EKS cluster using Helm
      - name: Deploy
        run: |
          aws eks update-kubeconfig --name cmg-log-processor-dev-cluster --region eu-central-1
          helm upgrade --install log-processor infrastructure/helm/log-processor \
            --namespace log-processing --create-namespace \
            --values infrastructure/helm/log-processor/values-dev.yaml \
            --set image.repository=${{ secrets.ECR_REPOSITORY }} \
            --set image.tag=${{ needs.build.outputs.image-tag }} \
            --set env[4].value=${{ secrets.DEV_QUEUE_URL }} \
            --set env[5].value=${{ secrets.DEV_S3_BUCKET }} \
            --set env[6].value=${{ secrets.DEV_DYNAMODB_TABLE }} \
            --set serviceAccount.annotations."eks\.amazonaws\.com/role-arn"=${{ secrets.DEV_SERVICE_ACCOUNT_ROLE_ARN }} \
            --wait
