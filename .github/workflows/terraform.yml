# Terraform infrastructure deployment workflow
# Manages AWS resources (VPC, EKS, SQS, S3, DynamoDB)
# Dev: Auto-deploys on push to main
# Production: Requires manual trigger and approval
name: Deploy Terraform Infrastructure

on:
  push:
    branches: [dev]
    paths:
      - 'infrastructure/terraform/**'
  pull_request:
    branches: [main]
    paths:
      - 'infrastructure/terraform/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - dev
          - production
      action:
        description: 'Terraform action'
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy

env:
  AWS_REGION: eu-central-1
  TF_VERSION: 1.5.0

permissions:
  id-token: write
  contents: read

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      
      - name: Terraform Init
        working-directory: infrastructure/terraform
        run: terraform init
      
      - name: Terraform Format Check
        working-directory: infrastructure/terraform
        run: terraform fmt -check -recursive
        continue-on-error: true
      
      - name: Terraform Validate
        working-directory: infrastructure/terraform
        run: terraform validate
      
      - name: Terraform Plan - Dev
        if: github.event_name == 'pull_request' || github.event.inputs.environment == 'dev'
        working-directory: infrastructure/terraform
        run: |
          terraform workspace select dev || terraform workspace new dev
          terraform plan -var-file=environments/dev.tfvars -out=dev.tfplan
      
      - name: Upload Dev Plan
        if: github.event_name == 'pull_request' || github.event.inputs.environment == 'dev'
        uses: actions/upload-artifact@v6
        with:
          name: dev-tfplan
          path: infrastructure/terraform/dev.tfplan
  
  terraform-apply-dev:
    name: Apply to Dev
    needs: terraform-plan
    runs-on: ubuntu-latest
    # Triggers:
    # 1. Automatic: Push to dev branch (deploys to dev workspace)
    # 2. Manual: workflow_dispatch with environment=dev and action=apply
    if: |
      (github.ref == 'refs/heads/dev' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev' && github.event.inputs.action == 'apply')
    environment:
      name: dev-infrastructure
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      
      - name: Terraform Init
        working-directory: infrastructure/terraform
        run: terraform init
      
      # Selects 'dev' workspace and applies dev.tfvars
      # Resources created: cmg-log-processor-dev-*
      - name: Terraform Apply - Dev
        working-directory: infrastructure/terraform
        run: |
          terraform workspace select dev || terraform workspace new dev
          terraform apply -var-file=environments/dev.tfvars -auto-approve
      
      - name: Save Outputs
        working-directory: infrastructure/terraform
        run: terraform output -json > outputs.json
      
      - name: Upload Outputs
        uses: actions/upload-artifact@v6
        with:
          name: dev-outputs
          path: infrastructure/terraform/outputs.json
  
  # Deploy observability stack after infrastructure is ready
  deploy-observability-dev:
    name: Deploy Observability Stack (Dev)
    needs: terraform-apply-dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig --name cmg-log-processor-dev-cluster --region eu-central-1
          kubectl get nodes
      
      - name: Install KEDA
        run: |
          helm repo add kedacore https://kedacore.github.io/charts
          helm repo update
          helm upgrade --install keda kedacore/keda \
            --namespace keda --create-namespace \
            --set podIdentity.aws.irsa.enabled=true \
            --wait
      
      - name: Install Observability Stack
        run: |
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo update
          helm upgrade --install loki grafana/loki-stack \
            --namespace observability --create-namespace \
            --set grafana.enabled=true \
            --set prometheus.enabled=true \
            --set prometheus.server.persistentVolume.enabled=true \
            --set loki.persistence.enabled=true \
            --set grafana.persistence.enabled=true \
            --wait
      
      - name: Install OpenTelemetry Collector
        run: |
          helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts
          helm repo update
          helm upgrade --install opentelemetry-collector open-telemetry/opentelemetry-collector \
            --namespace observability \
            --set mode=deployment \
            --wait
  
  terraform-apply-production:
    name: Apply to Production
    needs: terraform-plan
    runs-on: ubuntu-latest
    # Trigger: Manual workflow_dispatch ONLY
    # Requires: environment=production and action=apply
    # GitHub environment protection rules enforce manual approval
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production' && github.event.inputs.action == 'apply'
    environment:
      name: production-infrastructure
    steps:
      - uses: actions/checkout@v6
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      
      - name: Terraform Init
        working-directory: infrastructure/terraform
        run: terraform init
      
      # Selects 'production' workspace and applies production.tfvars
      # Resources created: cmg-log-processor-production-*
      - name: Terraform Apply - Production
        working-directory: infrastructure/terraform
        run: |
          terraform workspace select production || terraform workspace new production
          terraform apply -var-file=environments/production.tfvars -auto-approve
      
      - name: Save Outputs
        working-directory: infrastructure/terraform
        run: terraform output -json > outputs.json
      
      - name: Upload Outputs
        uses: actions/upload-artifact@v6
        with:
          name: production-outputs
          path: infrastructure/terraform/outputs.json
  
  # Deploy observability stack after infrastructure is ready
  deploy-observability-production:
    name: Deploy Observability Stack (Production)
    needs: terraform-apply-production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig --name cmg-log-processor-production-cluster --region eu-central-1
          kubectl get nodes
      
      - name: Install KEDA
        run: |
          helm repo add kedacore https://kedacore.github.io/charts
          helm repo update
          helm upgrade --install keda kedacore/keda \
            --namespace keda --create-namespace \
            --set podIdentity.aws.irsa.enabled=true \
            --wait
      
      - name: Install Observability Stack
        run: |
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo update
          helm upgrade --install loki grafana/loki-stack \
            --namespace observability --create-namespace \
            --set grafana.enabled=true \
            --set prometheus.enabled=true \
            --set prometheus.server.persistentVolume.enabled=true \
            --set prometheus.server.persistentVolume.size=50Gi \
            --set loki.persistence.enabled=true \
            --set loki.persistence.size=20Gi \
            --set grafana.persistence.enabled=true \
            --set grafana.replicas=2 \
            --wait
      
      - name: Install OpenTelemetry Collector
        run: |
          helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts
          helm repo update
          helm upgrade --install opentelemetry-collector open-telemetry/opentelemetry-collector \
            --namespace observability \
            --set mode=deployment \
            --set replicaCount=2 \
            --wait
