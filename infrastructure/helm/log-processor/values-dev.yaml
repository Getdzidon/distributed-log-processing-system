replicaCount: 1

image:
  repository: 123456789012.dkr.ecr.eu-central-1.amazonaws.com/log-processor
  pullPolicy: Always
  tag: "dev"

awsRegion: "eu-central-1"
queueUrl: "https://sqs.eu-central-1.amazonaws.com/123456789012/dlps-log-processor-dev-queue"

serviceAccount:
  create: true
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/dlps-log-processor-dev-log-processor"
  name: log-processor

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 10
  targetQueueDepth: 20

env:
  - name: ENVIRONMENT
    value: "dev"

  - name: SERVICE_NAME
    value: "log-processor"

  - name: AWS_REGION
    value: "eu-central-1"

  - name: OTLP_ENDPOINT
    value: "opentelemetry-collector.observability.svc.cluster.local:4317"

  - name: QUEUE_URL
    value: "https://sqs.eu-central-1.amazonaws.com/123456789012/dlps-log-processor-dev-queue"

  - name: RAW_LOGS_BUCKET
    value: "dlps-log-processor-dev-raw-logs"
    
  - name: PROCESSED_METRICS_TABLE
    value: "dlps-log-processor-dev-metrics"
