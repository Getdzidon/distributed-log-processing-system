replicaCount: 1

image:
  repository: ""  # Set by workflow from ECR repository URL
  pullPolicy: Always
  tag: "dev"

serviceAccount:
  create: true
  annotations:
    eks.amazonaws.com/role-arn: ""  # Set by workflow from Terraform output
  name: log-processor

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 10
  targetQueueDepth: 20

env:
  - name: ENVIRONMENT
    value: "dev"

  - name: SERVICE_NAME
    value: "log-processor"

  - name: AWS_REGION
    value: "eu-central-1"

  - name: OTLP_ENDPOINT
    value: "opentelemetry-collector.observability.svc.cluster.local:4317"

  - name: QUEUE_URL
    value: ""  # Set by workflow from Terraform output

  - name: RAW_LOGS_BUCKET
    value: ""  # Set by workflow from Terraform output
    
  - name: PROCESSED_METRICS_TABLE
    value: ""  # Set by workflow from Terraform output
