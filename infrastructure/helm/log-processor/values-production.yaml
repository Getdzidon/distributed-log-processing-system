replicaCount: 2

image:
  repository: ""  # Set by workflow from ECR repository URL
  pullPolicy: IfNotPresent
  tag: "latest"

serviceAccount:
  create: true
  annotations:
    eks.amazonaws.com/role-arn: ""  # Set by workflow from Terraform output
  name: log-processor

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 50
  targetQueueDepth: 10

env:
  - name: ENVIRONMENT
    value: "production"

  - name: SERVICE_NAME
    value: "log-processor"

  - name: AWS_REGION
    value: "eu-central-1"

  - name: OTLP_ENDPOINT
    value: "opentelemetry-collector.observability.svc.cluster.local:4317"

  - name: QUEUE_URL
    value: ""  # Set by workflow from Terraform output

  - name: RAW_LOGS_BUCKET
    value: ""  # Set by workflow from Terraform output
    
  - name: PROCESSED_METRICS_TABLE
    value: ""  # Set by workflow from Terraform output
