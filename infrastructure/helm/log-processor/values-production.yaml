replicaCount: 2

image:
  repository: 123456789012.dkr.ecr.eu-central-1.amazonaws.com/log-processor
  pullPolicy: IfNotPresent
  tag: "latest"

serviceAccount:
  create: true
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/cmg-log-processor-production-log-processor"
  name: log-processor

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 50
  targetQueueDepth: 10

env:
  - name: ENVIRONMENT
    value: "production"
  - name: SERVICE_NAME
    value: "log-processor"
  - name: AWS_REGION
    value: "eu-central-1"
  - name: OTLP_ENDPOINT
    value: "opentelemetry-collector.observability.svc.cluster.local:4317"
  - name: QUEUE_URL
    value: "https://sqs.eu-central-1.amazonaws.com/123456789012/cmg-log-processor-production-queue"
  - name: RAW_LOGS_BUCKET
    value: "cmg-log-processor-production-raw-logs"
  - name: PROCESSED_METRICS_TABLE
    value: "cmg-log-processor-production-metrics"
